name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Don't cancel in-progress runs so a deploy
# always completes.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          # Vite base path so assets resolve under /<repo-name>/ instead of the
          # domain root. Must match the repository name on GitHub Pages.
          GH_PAGES_BASE: /dora-guardian-buddy/
        run: bun run build

      - name: Debug build output
        # Temporary diagnostic: dumps the post-build file tree to this run's
        # public Summary tab (visible without signing in), since the exact
        # output layout has been a moving target across a couple of attempts.
        run: |
          {
            echo "### Build output tree (depth 6, excluding node_modules/.git)"
            echo '```'
            find . -maxdepth 6 -not -path "./node_modules*" -not -path "./.git*" | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Locate build output
        # TanStack Start's SPA mode (spa.enabled, on by default) prerenders a
        # generic app shell to a "_shell" file instead of a literal root
        # index.html, since the cloudflare-module Nitro preset is server-
        # oriented and doesn't prerender routes by default. Nitro also nests
        # the public dir under the configured baseURL, so the exact path
        # varies — search for it instead of hardcoding a guess.
        id: locate
        run: |
          set -e
          roots=()
          for d in ".output" "dist" "build" ".vercel/output/static"; do
            [ -d "$d" ] && roots+=("$d")
          done
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "::error::None of the expected output roots exist (.output, dist, build, .vercel/output/static)."
            find . -maxdepth 3 -not -path "./node_modules*" -not -path "./.git*" | sort
            exit 1
          fi

          shellFile=$(find "${roots[@]}" -mindepth 1 -maxdepth 8 -path "*_shell*" -name "*.html" 2>/dev/null | sort | head -n1)
          if [ -n "$shellFile" ]; then
            dir=$(dirname "$(dirname "$shellFile")")
            echo "Found SPA shell at $shellFile — using $dir as site root"
            cp "$shellFile" "$dir/index.html"
          else
            plainIndex=$(find "${roots[@]}" -mindepth 1 -maxdepth 6 -name index.html 2>/dev/null | sort | head -n1)
            if [ -z "$plainIndex" ]; then
              echo "::error::Could not locate any index.html or SPA shell in the build output."
              find "${roots[@]}" -maxdepth 6 | sort
              exit 1
            fi
            dir=$(dirname "$plainIndex")
            echo "Found build output at $dir"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Add SPA fallback for client-side routing
        # GitHub Pages has no server-side rewrites, so direct navigation to a
        # nested route (e.g. /assessment/new) 404s unless we serve the same
        # app shell for unmatched paths. TanStack Router then takes over
        # client-side and renders the right page.
        run: cp "${{ steps.locate.outputs.dir }}/index.html" "${{ steps.locate.outputs.dir }}/404.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
