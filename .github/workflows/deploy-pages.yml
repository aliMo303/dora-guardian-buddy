name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Don't cancel in-progress runs so a deploy
# always completes.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          # Vite base path so assets resolve under /<repo-name>/ instead of the
          # domain root. Must match the repository name on GitHub Pages.
          GH_PAGES_BASE: /dora-guardian-buddy/
        run: bun run build

      - name: Add SPA fallback for client-side routing
        # GitHub Pages has no server-side rewrites, so direct navigation to a
        # nested route (e.g. /assessment/new) 404s unless we serve the same
        # app shell for unmatched paths. TanStack Router then takes over
        # client-side and renders the right page.
        run: cp .output/public/index.html .output/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
